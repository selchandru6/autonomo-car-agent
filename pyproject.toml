[project]
name = "carshop"
version = "0.1.0"
description = "AI car shopping: auditable daily monitor for new 2026 BMW X5 xDrive40i listings at approved Texas BMW dealers."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Owner" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "playwright>=1.47",
  "selectolax>=0.3.21",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "tenacity>=9.0",
  "structlog>=24.4",
  "protego>=0.3.1",
  "typer>=0.12",
  "openpyxl>=3.1",
  "tzdata>=2024.2",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "rich>=13.8",
]

[project.optional-dependencies]
graph = ["langgraph>=0.2.40", "langgraph-checkpoint-sqlite>=2.0"]
llm = ["openai>=1.50"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "respx>=0.21",
  "time-machine>=2.15",
  "hypothesis>=6.112",
  "pre-commit>=3.8",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "deptry>=0.20",
  "types-PyYAML",
  "types-openpyxl",
]

[project.scripts]
carshop = "carshop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carshop"]

[tool.uv]
package = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "DTZ", "PL", "RUF", "ASYNC", "T20", "ERA",
  "C4", "SIM", "RET", "PIE", "PTH", "N", "A", "TID", "ARG",
]
ignore = [
  "PLR0913", # many arguments: domain records are wide by design
  "PLR2004", # magic values: reference codes are documented inline
  "S101",    # assert: used in tests
  "E501",    # formatter owns line length
  "PLR0912", "PLR0915", "PLR0911", "PLR0917", # complex parsers are reviewed, not split blindly
  "PLC0415", # lazy imports keep optional deps (playwright, openai, uvicorn) out of the import graph
  "N818",    # exception names read as nouns here (RunRejected, SsrfBlocked)
  "S110", "SIM105", # try/except/pass around best-effort waits is intentional and commented
  "ARG002",  # protocol implementations keep the full signature even when a parameter is unused
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG", "DTZ", "T20"]
"migrations/**" = ["E501", "I"]
"src/carshop/cli.py" = ["T20", "B008"]
"src/carshop/web/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["carshop"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"
packages = ["carshop"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider --strict-markers -q"
markers = [
  "live: hits real dealer sites; rate-limited; never the accuracy gate",
  "gate: section 13 must-pass release gate",
]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:carshop.*"]

[tool.coverage.run]
source = ["carshop"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- deptry
[tool.deptry]
known_first_party = ["carshop"]

[tool.deptry.per_rule_ignores]
DEP002 = ["tzdata", "uvicorn", "python-multipart", "opentelemetry-exporter-otlp-proto-http"]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
