# Operator overrides for the generated dealer registry (requirements 7.1, F25).
#
# The registry itself is built by `carshop registry refresh` from the BMW USA dealer locator
# (every Texas BMW dealer) plus automatic inventory-URL discovery. Nothing here adds or
# approves a dealer. An entry only overrides what discovery found for one center number:
# the hostname (when the locator prints none or the wrong one), the X5 start URL, the path
# prefixes, the platform, or sticker hosts.
#
# Every entry is a privileged edit (section 3): `operator` and `set_at` are required and are
# written to the dealer row's notes and to audit_events when the registry is applied.
#
# Center numbers are the locator's `centerID`; run `carshop registry show` to list them.
#
# Centers below had no usable locator website (review 2026-10-20 registry gaps, section A).
# Each start URL is the one in that review, after the "check before use" items. A 403 is
# kept: the dealer is attempted and the block stays visible. Year-filtered and trim-filtered
# homepage links are not used (Lubbock year=2027, Wichita Falls sDrive40i).
overrides:
  - center_number: "50923"   # Sewell BMW of Plano (locator name "BMW of Plano"; no website in locator)
    operator: owner
    set_at: "2026-10-20T00:00:00+00:00"
    hostname: www.bmwofplano.com
    start_url: https://www.bmwofplano.com/new-vehicles/x5/
    path_prefixes: ["/new-vehicles/", "/inventory/"]
    platform: dealer_inspire
    notes: "Sewell store-specific site; verify no sister-store units (review A.1)"

  - center_number: "52938"   # BMW of McKinney (Hendrick)
    operator: owner
    set_at: "2026-10-20T00:00:00+00:00"
    hostname: www.bmwofmckinney.com
    start_url: https://www.bmwofmckinney.com/new-vehicles/x5/
    path_prefixes: ["/new-vehicles/", "/inventory/"]
    platform: dealer_inspire

  - center_number: "44235"   # BMW of South Austin (Hendrick)
